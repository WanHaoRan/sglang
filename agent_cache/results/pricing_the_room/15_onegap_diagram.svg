<svg xmlns="http://www.w3.org/2000/svg" width="832pt" height="190pt" viewBox="0 0 1664 380" font-family="'IBM Plex Sans', Arial, sans-serif">
<title>Four rules act at four points of one idle gap</title>
<text x="0" y="78.8" font-size="24" font-weight="600" fill="#1b2330" xml:space="preserve">Session</text>
<rect x="170" y="40" width="120" height="60" rx="6" fill="#2a62a8"/>
<text x="230" y="79" font-size="24" fill="#fafaf7" text-anchor="middle" xml:space="preserve">turn</text>
<rect x="297" y="41" width="852" height="58" rx="5" fill="none" stroke="#9aa1ad" stroke-width="2" stroke-dasharray="6 4"/>
<text x="723" y="79" font-size="24" fill="#4a5363" text-anchor="middle" xml:space="preserve">the agent runs a tool</text>
<rect x="1157" y="41" width="242" height="58" rx="5" fill="#f1efe8" stroke="#9aa1ad" stroke-width="2" stroke-dasharray="6 4"/>
<text x="1278" y="79" font-size="24" fill="#4a5363" text-anchor="middle" xml:space="preserve">queued, <tspan font-style="italic">Ŵ</tspan></text>
<rect x="1406" y="40" width="258" height="60" rx="6" fill="#2a62a8"/>
<text x="1535" y="79" font-size="24" fill="#fafaf7" text-anchor="middle" xml:space="preserve">next turn</text>
<text x="296" y="133.8" font-size="24" fill="#636b78" xml:space="preserve">turn ends</text>
<text x="1156" y="133.8" font-size="24" fill="#636b78" xml:space="preserve">turn arrives</text>
<text x="1406" y="133.8" font-size="24" fill="#636b78" xml:space="preserve">admitted</text>
<text x="886" y="175.8" font-size="24" font-weight="600" fill="#a94e12" xml:space="preserve">1 · starts at <tspan font-style="italic">σ</tspan>*</text>
<text x="0" y="228.8" font-size="24" font-weight="600" fill="#1b2330" xml:space="preserve">Prefix Cache</text>
<rect x="297" y="191" width="322" height="58" rx="5" fill="#dce4f0" stroke="#2a62a8" stroke-width="2"/>
<text x="458" y="229" font-size="24" fill="#1b2330" text-anchor="middle" xml:space="preserve">in the host room</text>
<rect x="627" y="191" width="252" height="58" rx="5" fill="none" stroke="#9aa1ad" stroke-width="2" stroke-dasharray="6 4"/>
<text x="753" y="229" font-size="24" fill="#4a5363" text-anchor="middle" xml:space="preserve">SSD only</text>
<rect x="886" y="190" width="174" height="60" rx="6" fill="#2a62a8"/>
<text x="973" y="229" font-size="24" fill="#fafaf7" text-anchor="middle" xml:space="preserve">read, <tspan font-style="italic">r</tspan></text>
<rect x="1067" y="191" width="332" height="58" rx="5" fill="#f6e2d2" stroke="#a94e12" stroke-width="2"/>
<text x="1233" y="229" font-size="24" fill="#8f400c" text-anchor="middle" xml:space="preserve">staged, pinned</text>
<rect x="1406" y="190" width="258" height="60" rx="6" fill="#2a62a8"/>
<text x="1535" y="229" font-size="24" fill="#fafaf7" text-anchor="middle" xml:space="preserve">on the GPU</text>
<text x="296" y="287.8" font-size="24" font-weight="600" fill="#a94e12" xml:space="preserve">3 · stays while it ranks high enough</text>
<text x="1066" y="287.8" font-size="24" font-weight="600" fill="#a94e12" xml:space="preserve">2 · may yield to an arrived turn</text>
<rect x="170" y="316" width="1494" height="56" rx="6" fill="#f1efe8"/>
<text x="190" y="353" font-size="24" fill="#1b2330" xml:space="preserve"><tspan font-weight="600" fill="#a94e12">4 ·</tspan> <tspan font-style="italic">λ</tspan> is updated every few seconds from refused and idle room</text>
</svg>
