<title>The chance a 64K-token read started now lands after the turn is due, F(r | t), against idle time, on two made-up keys. On a key of 20 plus or minus 2 seconds it rises from 0 to 1 between 14 and 22 seconds and crosses the 0.77 threshold at 19 seconds. On a pip-like key it starts at 0.2, drops near 0 within 2 seconds, and stays below 0.15.</title>
