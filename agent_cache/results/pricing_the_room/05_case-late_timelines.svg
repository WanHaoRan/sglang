<svg xmlns="http://www.w3.org/2000/svg" width="832pt" height="228pt" viewBox="0 0 1664 456" font-family="'IBM Plex Sans', Arial, sans-serif">
<title>With no hint, the turn waits at the head of the queue</title>
<text x="0" y="25.8" font-size="24" fill="#1B2330" xml:space="preserve"><tspan font-weight="600">No hint, no pin</tspan> · original HiCache</text>
<text x="1664" y="25.8" font-size="24" font-weight="600" fill="#1B2330" text-anchor="end" xml:space="preserve">TTFT 1.50 s</text>
<text x="0" y="70.8" font-size="24" fill="#636B78" xml:space="preserve">history</text>
<text x="0" y="122.8" font-size="24" fill="#636B78" xml:space="preserve">turn</text>
<rect x="170" y="61" width="1470" height="2" fill="#E4E1D8"/>
<rect x="170" y="113" width="1470" height="2" fill="#E4E1D8"/>
<rect x="1051" y="34" width="2" height="108" fill="#1B2330"/>
<text x="1046" y="70.8" font-size="24" fill="#4A5363" text-anchor="end" xml:space="preserve">on SSD only until the turn arrives</text>
<rect x="1058" y="40" width="161" height="44" rx="6" fill="#2A62A8"/>
<text x="1231" y="70.8" font-size="24" fill="#4A5363" xml:space="preserve">read 22K tokens: 1.1 s</text>
<text x="1040" y="122.8" font-size="24" fill="#4A5363" text-anchor="end" xml:space="preserve">arrives, nothing ahead</text>
<rect x="1052" y="92" width="171" height="44" rx="6" fill="#8F400C"/>
<text x="1235" y="122.8" font-size="24" fill="#4A5363" xml:space="preserve">waits 1.2 s for its read</text>
<text x="0" y="181.8" font-size="24" fill="#1B2330" xml:space="preserve"><tspan font-weight="600">p50 hint</tspan> · JIT p50 <tspan fill="#636B78">· pytest: p10 7.0 s, p50 12.2 s, p90 43 s</tspan></text>
<text x="1664" y="181.8" font-size="24" font-weight="600" fill="#1B2330" text-anchor="end" xml:space="preserve">TTFT 0.29 s</text>
<text x="0" y="226.8" font-size="24" fill="#636B78" xml:space="preserve">history</text>
<text x="0" y="278.8" font-size="24" fill="#636B78" xml:space="preserve">turn</text>
<rect x="170" y="217" width="1470" height="2" fill="#E4E1D8"/>
<rect x="170" y="269" width="1470" height="2" fill="#E4E1D8"/>
<rect x="1051" y="190" width="2" height="108" fill="#1B2330"/>
<rect x="231" y="196" width="205" height="44" rx="6" fill="#2A62A8"/>
<rect x="437" y="197" width="614" height="42" rx="5" fill="#F6E2D2" stroke="#A94E12" stroke-width="2"/>
<text x="744" y="227" font-size="24" fill="#8F400C" text-anchor="middle" xml:space="preserve">pinned 4.2 s, until admission</text>
<text x="1040" y="278.8" font-size="24" fill="#4A5363" text-anchor="end" xml:space="preserve">away 17.3 s; the p50 said 12.2 s</text>
<text x="1064" y="278.8" font-size="24" fill="#4A5363" xml:space="preserve">admitted at once</text>
<text x="0" y="337.8" font-size="24" fill="#1B2330" xml:space="preserve"><tspan font-weight="600">Exact hint</tspan> · JIT exact <tspan fill="#636B78">· the same turn, gap 17.3 s</tspan></text>
<text x="1664" y="337.8" font-size="24" font-weight="600" fill="#1B2330" text-anchor="end" xml:space="preserve">TTFT 0.21 s</text>
<text x="0" y="382.8" font-size="24" fill="#636B78" xml:space="preserve">history</text>
<text x="0" y="434.8" font-size="24" fill="#636B78" xml:space="preserve">turn</text>
<rect x="170" y="373" width="1470" height="2" fill="#E4E1D8"/>
<rect x="170" y="425" width="1470" height="2" fill="#E4E1D8"/>
<rect x="1051" y="346" width="2" height="108" fill="#1B2330"/>
<text x="806" y="382.8" font-size="24" fill="#4A5363" text-anchor="end" xml:space="preserve">read starts 1.6 s before arrival, lands 0.5 s before</text>
<rect x="818" y="352" width="158" height="44" rx="6" fill="#2A62A8"/>
<rect x="977" y="353" width="74" height="42" rx="5" fill="#F6E2D2" stroke="#A94E12" stroke-width="2"/>
<text x="1064" y="434.8" font-size="24" fill="#4A5363" xml:space="preserve">admitted at once</text>
</svg>
