<svg xmlns="http://www.w3.org/2000/svg" width="832pt" height="180pt" viewBox="0 0 1664 360" font-family="'IBM Plex Sans', Arial, sans-serif">
<title>Landing early costs memory; landing late costs stall</title>
<text x="0" y="25.8" font-size="24" font-weight="600" fill="#1b2330" xml:space="preserve">Lands early</text>
<rect x="0" y="95" width="1664" height="2" fill="#9aa1ad"/>
<rect x="260" y="66" width="400" height="60" rx="6" fill="#2a62a8"/>
<text x="280" y="105" font-size="24" fill="#fafaf7" xml:space="preserve">read: <tspan font-style="italic">r</tspan> = <tspan font-style="italic">bL</tspan>/<tspan font-style="italic">β</tspan></text>
<rect x="661" y="67" width="558" height="58" rx="5" fill="#f6e2d2" stroke="#a94e12" stroke-width="2"/>
<text x="682" y="105" font-size="24" fill="#8f400c" xml:space="preserve">pinned: costs <tspan font-style="italic">λL</tspan> per second</text>
<text x="260" y="161.8" font-size="24" fill="#4a5363" xml:space="preserve"><tspan font-style="italic">σ</tspan>: read starts</text>
<text x="660" y="161.8" font-size="24" fill="#4a5363" xml:space="preserve"><tspan font-style="italic">ℓ</tspan>: read lands</text>
<text x="1220" y="161.8" font-size="24" fill="#4a5363" xml:space="preserve"><tspan font-style="italic">D</tspan>: turn admitted</text>
<text x="0" y="211.8" font-size="24" font-weight="600" fill="#1b2330" xml:space="preserve">Lands late</text>
<rect x="0" y="281" width="1664" height="2" fill="#9aa1ad"/>
<rect x="260" y="252" width="880" height="60" rx="6" fill="#2a62a8"/>
<text x="280" y="291" font-size="24" fill="#fafaf7" xml:space="preserve">read: <tspan font-style="italic">r</tspan> = <tspan font-style="italic">bL</tspan>/<tspan font-style="italic">β</tspan></text>
<rect x="700" y="252" width="440" height="60" rx="6" fill="#8f400c"/>
<text x="720" y="291" font-size="24" fill="#fafaf7" xml:space="preserve">stall: costs 1 per second</text>
<text x="260" y="347.8" font-size="24" fill="#4a5363" xml:space="preserve"><tspan font-style="italic">σ</tspan>: read starts</text>
<text x="700" y="347.8" font-size="24" fill="#4a5363" xml:space="preserve"><tspan font-style="italic">D</tspan>: turn due</text>
<text x="1140" y="347.8" font-size="24" fill="#4a5363" xml:space="preserve"><tspan font-style="italic">ℓ</tspan>: read lands, turn admitted</text>
</svg>
