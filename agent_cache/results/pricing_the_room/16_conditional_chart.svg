<svg xmlns="http://www.w3.org/2000/svg" width="420pt" height="190pt" viewBox="0 0 840 380" font-family="'IBM Plex Sans', Arial, sans-serif">
<title>Schematic of a two-moded gap distribution over the time since the last turn ended. The time already idle is shaded grey; the next x seconds after now are highlighted under the curve.</title>
<svg x="0" y="0" aria-label="Schematic of a two-moded gap distribution over the time since the last turn ended. The time already idle is shaded grey; the next x seconds after now are highlighted under the curve." width="840" height="380" viewBox="0 0 840 380">
<defs>
<clipPath id="under"><path d="M20,320 C45,320 60,120 92,120 C124,120 136,300 180,312 C240,326 330,250 420,215 C500,183 540,170 580,172 C650,176 720,280 820,312 L820,320 Z"/></clipPath>
</defs>
<path d="M20,320 C45,320 60,120 92,120 C124,120 136,300 180,312 C240,326 330,250 420,215 C500,183 540,170 580,172 C650,176 720,280 820,312 L820,320 Z" fill="#DCE4F0" stroke="#2A62A8" stroke-width="3"/>
<rect x="20" y="40" width="320" height="280" fill="#636B78" opacity="0.16"/>
<rect x="340" y="40" width="130" height="280" fill="#A94E12" opacity="0.6" clip-path="url(#under)"/>
<line x1="340" y1="40" x2="340" y2="320" stroke="#1B2330" stroke-width="2" stroke-dasharray="8 6"/>
<line x1="20" y1="320" x2="820" y2="320" stroke="#9AA1AD" stroke-width="2"/>
</svg>
<text x="28" y="25.8" font-size="24" fill="#4A5363" xml:space="preserve">idle so far: <tspan font-style="italic">a</tspan></text>
<text x="350" y="25.8" font-size="24" fill="#1B2330" xml:space="preserve">now: <tspan font-style="italic">t</tspan></text>
<text x="350" y="65.8" font-size="24" font-weight="600" fill="#8F400C" xml:space="preserve">next <tspan font-style="italic">x</tspan> seconds</text>
<text x="112" y="121.8" font-size="24" fill="#4A5363" xml:space="preserve">short mode</text>
<text x="604" y="149.8" font-size="24" fill="#4A5363" xml:space="preserve">long mode</text>
<text x="20" y="361.8" font-size="24" fill="#636B78" xml:space="preserve">time since the last turn ended →</text>
</svg>
