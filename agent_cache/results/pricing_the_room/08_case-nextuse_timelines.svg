<svg xmlns="http://www.w3.org/2000/svg" width="832pt" height="228pt" viewBox="0 0 1664 456" font-family="'IBM Plex Sans', Arial, sans-serif">
<title>Eviction by the p50 drops histories that return early</title>
<text x="0" y="25.8" font-size="24" fill="#1B2330" xml:space="preserve"><tspan font-weight="600">No hint, no pin</tspan> · original HiCache <tspan fill="#636B78">· LRU; back 0.8 s after its last turn</tspan></text>
<text x="1664" y="25.8" font-size="24" font-weight="600" fill="#1B2330" text-anchor="end" xml:space="preserve">TTFT 0.32 s</text>
<text x="0" y="70.8" font-size="24" fill="#636B78" xml:space="preserve">history</text>
<text x="0" y="122.8" font-size="24" fill="#636B78" xml:space="preserve">turn</text>
<rect x="170" y="61" width="1470" height="2" fill="#E4E1D8"/>
<rect x="170" y="113" width="1470" height="2" fill="#E4E1D8"/>
<rect x="858" y="34" width="2" height="108" fill="#1B2330"/>
<rect x="986" y="34" width="2" height="108" fill="#1B2330"/>
<text x="847" y="70.8" font-size="24" fill="#4A5363" text-anchor="end" xml:space="preserve">used 0.8 s ago, so LRU keeps it in GPU memory</text>
<rect x="859" y="40" width="128" height="44" rx="6" fill="#E4E1D8"/>
<text x="999" y="122.8" font-size="24" fill="#4A5363" xml:space="preserve">admitted at once</text>
<text x="0" y="181.8" font-size="24" fill="#1B2330" xml:space="preserve"><tspan font-weight="600">p50 hint</tspan> · JIT p50 <tspan fill="#636B78">· sphinx: p10 2.0 s, p50 7.2 s, p90 17 s</tspan></text>
<text x="1664" y="181.8" font-size="24" font-weight="600" fill="#1B2330" text-anchor="end" xml:space="preserve">TTFT 3.58 s</text>
<text x="0" y="226.8" font-size="24" fill="#636B78" xml:space="preserve">history</text>
<text x="0" y="278.8" font-size="24" fill="#636B78" xml:space="preserve">turn</text>
<rect x="170" y="217" width="1470" height="2" fill="#E4E1D8"/>
<rect x="170" y="269" width="1470" height="2" fill="#E4E1D8"/>
<rect x="858" y="190" width="2" height="108" fill="#1B2330"/>
<rect x="986" y="190" width="2" height="108" fill="#1B2330"/>
<text x="847" y="226.8" font-size="24" fill="#4A5363" text-anchor="end" xml:space="preserve">expected back in 7.7 s: evicted from GPU and host</text>
<rect x="860" y="197" width="126" height="42" rx="5" fill="none" stroke="#A94E12" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="993" y="196" width="435" height="44" rx="6" fill="#2A62A8"/>
<text x="1210.5" y="227" font-size="24" fill="#FAFAF7" text-anchor="middle" xml:space="preserve">read 39K tokens: 2.7 s</text>
<rect x="1429" y="197" width="89" height="42" rx="5" fill="#F6E2D2" stroke="#A94E12" stroke-width="2"/>
<rect x="987" y="248" width="532" height="44" rx="6" fill="#8F400C"/>
<text x="1253" y="279" font-size="24" fill="#FAFAF7" text-anchor="middle" xml:space="preserve">waits 3.3 s for its read</text>
<text x="0" y="337.8" font-size="24" fill="#1B2330" xml:space="preserve"><tspan font-weight="600">Exact hint</tspan> · JIT exact <tspan fill="#636B78">· the same turn, gap 0.8 s</tspan></text>
<text x="1664" y="337.8" font-size="24" font-weight="600" fill="#1B2330" text-anchor="end" xml:space="preserve">TTFT 0.29 s</text>
<text x="0" y="382.8" font-size="24" fill="#636B78" xml:space="preserve">history</text>
<text x="0" y="434.8" font-size="24" fill="#636B78" xml:space="preserve">turn</text>
<rect x="170" y="373" width="1470" height="2" fill="#E4E1D8"/>
<rect x="170" y="425" width="1470" height="2" fill="#E4E1D8"/>
<rect x="858" y="346" width="2" height="108" fill="#1B2330"/>
<rect x="986" y="346" width="2" height="108" fill="#1B2330"/>
<text x="847" y="382.8" font-size="24" fill="#4A5363" text-anchor="end" xml:space="preserve">expected back in 0.9 s: kept in GPU memory</text>
